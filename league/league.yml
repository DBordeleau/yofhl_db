# Individual awards, in display order. `name` is the stored name and URL slug source.
awards:
  - { name: Wayne Gretzky Award, description: Top Player }
  - { name: Le Magnifique, description: MVP }
  - { name: Bobby Orr Award, description: Top Defenseman }
  - { name: Hasek Trophy, description: Top Goaltender }
  - { name: Teemu Trophy, label: Teemu Selanne Trophy, description: Top Rookie }
  - { name: Danny Briere Award, description: Playoff MVP }

# Season-specific facts about the playoffs
seasons:
  2020:
    playoffs: cancelled # COVID-19
  2021:
    # the 2020–21 export holds two 4-team brackets; these teams played the consolation one
    consolation: [JTPJ, NFLD, MAC, MEAT]

# The longer final's goalie-start limit retroactively changed earlier playoff scores.
# Verified reconstructions use the original four-start cap, including every start on the day
# it was reached. Daily scoring and NHL starter evidence are in playoff-goalie-audit.json.
# The league owner confirmed that starts after the cap stopped counting.
scoreOverrides:
  - { season: 2022, round: 2, team: PVLS, score: 274.5, verified: true, note: Excludes Hellebuyck's March 13 start after the four-start cap }
  - { season: 2024, round: 2, team: JAGR, score: 312.25, verified: true, note: Excludes Luukkonen's March 24 start after the four-start cap }
  - { season: 2025, round: 2, team: SKGS, score: 294.5, verified: true, note: Excludes Oettinger and Blackwood's March 29 starts after the four-start cap }
