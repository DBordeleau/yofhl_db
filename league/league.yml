# YOFHL league configuration: the hand-maintained facts the Fantrax CSVs don't contain.
# The importer (npm run db:import) reads this file on every run.
#
# Seasons are identified by the year they end in: 2026 means the 2025–26 season.
#
# Franchises
#   id            stable franchise id (used in /teams/[id] URLs), never reuse one
#   eras          one entry per identity the franchise has had. Add a new era when a team is
#                 renamed/rebranded or changes hands; styling differences ("Ice Fellas" vs
#                 "Icefellas", "and" vs "&", a leading "The") are matched automatically
#     from / to   first and last season of the era (omit "to" while the era is current)
#     name        display name for the era
#     abbreviations   every abbreviation Fantrax used for the team during the era
#     owner       owner during the era (leave out if unknown)
#     logo        path under /public, optional; full-bleed artwork (own background) goes in /public/logos/ and fills the badge
#     aliases     extra Fantrax spellings that normalisation doesn't catch, optional
#   folded        last season played, for franchises that no longer exist

franchises:
  - id: 1
    eras:
      - { from: 2019, to: 2021, name: Hub City Hyman Hounds, abbreviations: [HCHH], owner: Sean Crocker, logo: /logos/hub_city_hyman_hounds.jpg }
