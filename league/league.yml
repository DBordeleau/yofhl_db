# Individual awards, in display order. `name` is the stored name and URL slug source.
awards:
  - { name: Wayne Gretzky Award, description: Top Player }
  - { name: Le Magnifique, description: MVP }
  - { name: Bobby Orr Award, description: Top Defenseman }
  - { name: Hasek Trophy, description: Top Goaltender }
  - { name: Teemu Trophy, label: Teemu Selanne Trophy, description: Top Rookie }
  - { name: Danny Briere Award, description: Playoff MVP }

# Season-specific facts about the playoffs
seasons:
  2020:
    playoffs: cancelled # COVID-19
  2021:
    # the 2020–21 export holds two 4-team brackets; these teams played the consolation one
    consolation: [JTPJ, NFLD, MAC, MEAT]

# Playoff scores that need correcting before import.
# Raising the goalie-start limit for the longer final round made Fantrax retroactively rescore the
# earlier playoff rounds. The original scores are lost, so the rescored exports show three
# semi-final losers who actually advanced. Each fix lifts the team that advanced to 0.25 (the
# smallest scoring increment) above its opponent.
scoreOverrides:
  - { season: 2022, round: 2, team: VWIZ, score: 282.75, note: Rescored after a later rule change; adjusted to match the real result }
  - { season: 2024, round: 2, team: VWIZ, score: 328.5, note: Rescored after a later rule change; adjusted to match the real result }
  - { season: 2025, round: 2, team: HUNG, score: 314.75, note: Rescored after a later rule change; adjusted to match the real result }
